<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e7a43"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d682"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#gGold)"/>
  <circle cx="100" cy="100" r="87" fill="#14532d"/>
  <circle cx="100" cy="100" r="80" fill="url(#gGreen)"/>
  <!-- crescent -->
  <circle cx="96" cy="88" r="52" fill="url(#gGold)"/>
  <circle cx="75" cy="78" r="44" fill="url(#gGreen)"/>
  <!-- ring above -->
  <circle cx="134" cy="42" r="15" fill="none" stroke="#f0d682" stroke-width="6"/>
  <!-- coins -->
  <g fill="url(#gGold)" stroke="#785c0a" stroke-width="1.6">
    <circle cx="134" cy="140" r="11.5"/>
    <circle cx="100" cy="148" r="11.5"/>
    <circle cx="66" cy="140" r="11.5"/>
  </g>
  <g fill="none" stroke="#f0d682" stroke-width="1.4">
    <circle cx="134" cy="140" r="6.5"/>
    <circle cx="100" cy="148" r="6.5"/>
    <circle cx="66" cy="140" r="6.5"/>
  </g>
  <!-- wheat dots -->
  <g fill="#f0d682">
    <circle cx="100" cy="167" r="4"/>
    <circle cx="88" cy="167" r="3.4"/>
    <circle cx="112" cy="167" r="3.4"/>
  </g>
</svg>
