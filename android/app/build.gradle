plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yemencoding.zakatfund'
    compileSdk 34

    defaultConfig {
        applicationId "com.yemencoding.zakatfund"
        minSdk 28          /* Android 9 Pie */
        targetSdk 34       /* Android 14 */
        versionCode 2
        versionName "1.1.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            /* مفتاح ذاتي التوقيع ثابت في المستودع لتثبيت/تحديث آمن */
            storeFile file("../keystore/zakat-release.jks")
            storePassword "zakat2025"
            keyAlias "zakat"
            keyPassword "zakat2025"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7/jdk8 merged into kotlin-stdlib since 1.8.0 — fix duplicate classes")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk7/jdk8 merged into kotlin-stdlib since 1.8.0 — fix duplicate classes")
        }
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
